<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paste Into: clean Markdown, rich text, WhatsApp or plain text</title>
  <meta name="description" content="Paste from Google Docs, Notion, Word, Claude or anywhere. Get clean Markdown, email-ready rich text, WhatsApp text or plain text, auto-copied to your clipboard.">
  <link rel="icon" type="image/png" href="paperclip.png">
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/iAWriterMonoS-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div class="eyebrow">Paste Into</div>
      <h1>Paste anything. Get clean <span id="outputNoun">Markdown</span>.</h1>
      <p class="subtitle">Paste anywhere on the page. Links, bold, italics and lists are kept; fonts, sizes and spacing are dropped. The result is auto-copied to your clipboard.</p>
    </header>

    <div class="controls">
      <div class="pills" role="group" aria-label="Output format">
        <button type="button" class="pill" data-output="markdown">Markdown</button>
        <button type="button" class="pill" data-output="rich">Rich text</button>
        <button type="button" class="pill" data-output="whatsapp">WhatsApp</button>
        <button type="button" class="pill" data-output="plain">Plain text</button>
      </div>
      <span id="outputHint" class="hint"></span>
    </div>

    <div class="container">
      <section class="box output-box">
        <div class="section-header">
          <h3 class="section-label">Output</h3>
          <div class="section-meta">
            <span id="copyFlash" class="copy-flash" role="status"></span>
            <select id="sourceSelect" class="source-select" aria-label="Read the paste as" hidden>
              <option value="auto">From …</option>
              <option value="rich">Read as rich text</option>
              <option value="markdown">Read as Markdown</option>
              <option value="text">Read as plain text</option>
            </select>
          </div>
        </div>
        <div class="card">
          <div id="output" class="output-content"></div>
        </div>
      </section>
    </div>

    <footer class="page-footer">
      <span>Runs in your browser. Nothing you paste is uploaded.</span>
      <span class="dot">·</span>
      <a href="https://github.com/dewierwan/paste-to-markdown">GitHub</a>
    </footer>
  </main>

  <script src="js/vendor/marked.umd.js"></script>
  <script src="js/clean-html.js"></script>
  <script src="js/to-markdown.js"></script>
  <script src="js/to-text.js"></script>
  <script src="js/convert.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
