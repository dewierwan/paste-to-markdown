<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paste Into: Markdown, email and Slack, Docs, WhatsApp or plain text</title>
  <meta name="description" content="Paste from Google Docs, Notion, Word, Claude or anywhere. Get Markdown, email and Slack text, rich text, WhatsApp text or plain text, auto-copied to your clipboard.">
  <link rel="icon" type="image/png" href="paperclip.png">
  <link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/iAWriterMonoS-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css?v=e60ffd97">
  <script src="js/extension.js?v=6aa5ea2a"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Paste anything. Get <span id="outputNoun">markdown</span>.</h1>
    </header>

    <div class="controls">
      <div class="control-row">
        <span class="control-label" id="fromLabel">From</span>
        <div id="readPills" class="pills pills-from" role="group" aria-labelledby="fromLabel" aria-disabled="true">
          <button type="button" class="pill" data-read="markdown" disabled>Markdown</button>
          <button type="button" class="pill" data-read="rich" disabled>Rich text</button>
          <button type="button" class="pill" data-read="text" disabled>Plain text</button>
          <button type="button" class="pill" data-read="pdf" disabled>PDF</button>
        </div>
        <span id="sourceHint" class="hint"></span>
      </div>
      <div class="control-row">
        <span class="control-label" id="toLabel">To</span>
        <div class="pills" role="group" aria-labelledby="toLabel">
          <button type="button" class="pill" data-output="markdown">Markdown</button>
          <button type="button" class="pill" data-output="email">Email &amp; Slack</button>
          <button type="button" class="pill" data-output="rich">Docs</button>
          <button type="button" class="pill" data-output="whatsapp">WhatsApp</button>
          <button type="button" class="pill" data-output="plain">Plain text</button>
        </div>
        <span id="outputHint" class="hint"></span>
      </div>
    </div>

    <div class="container">
      <section class="box output-box">
        <div class="section-header">
          <span id="copyFlash" class="copy-flash" role="status"></span>
        </div>
        <div class="card">
          <div id="output" class="output-content"></div>
        </div>
      </section>
    </div>

    <footer class="page-footer">
      <span>Nothing you paste leaves your browser. Usage is counted anonymously. <a href="https://github.com/dewierwan/pasteinto/issues/new">Provide feedback</a>.</span>
    </footer>
  </main>

  <script src="js/vendor/marked.umd.js?v=21568877"></script>
  <script src="js/clean-html.js?v=16b3a2e3"></script>
  <script src="js/to-markdown.js?v=eb9a166b"></script>
  <script src="js/to-text.js?v=34c0a88d"></script>
  <script src="js/from-pdf.js?v=394482df"></script>
  <script src="js/convert.js?v=ac2d9b7b"></script>
  <script src="js/analytics.js?v=96ca48e7"></script>
  <script src="js/app.js?v=cc3077fc"></script>
</body>
</html>
